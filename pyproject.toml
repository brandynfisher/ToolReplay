[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toolreplay"
version = "0.6.0"
description = "Audit AI agent tool-call traces by hash-chaining and deterministic replay."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matthew0822", email = "15010780+Matthew0822@users.noreply.github.com" }]
keywords = ["audit", "tool-call", "replay", "hash-chain", "determinism"]

[project.scripts]
toolreplay = "toolreplay.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

