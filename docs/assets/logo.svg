<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 96" role="img"
     aria-labelledby="title desc" width="240" height="96">
  <!--
    Palette reason: the tool audits chains of tool calls. Slate-teal (#276b6b)
    marks sealed, intact links, the calm expected state. Clay-red (#a5361f)
    marks a finding, the thing that breaks a clean replay. Amber (#8a5f08) is
    the single accent and appears once, on the exact link where replay diverged.
    Neutrals are ink (#1c2321) for text and paper (#f4f1ea) for the background.
    No AI-default palette: no indigo, violet, cyan, or neon.
  -->
  <title id="title">toolreplay wordmark</title>
  <desc id="desc">The name toolreplay split in colour at the compound boundary,
    with a three block hash chain where the third block is marked as the
    diverged link.</desc>

  <rect x="0" y="0" width="240" height="96" fill="#f4f1ea"/>

  <!-- Mark: three linked blocks, a literal hash chain. Third is the diverged link. -->
  <g fill="none" stroke-width="1.5">
    <rect x="16" y="20" width="24" height="24" rx="3" fill="#276b6b" stroke="#276b6b"/>
    <rect x="52" y="20" width="24" height="24" rx="3" fill="#276b6b" stroke="#276b6b"/>
    <rect x="88" y="20" width="24" height="24" rx="3" fill="#a5361f" stroke="#a5361f"/>
    <!-- connectors between blocks, one stroke width per role -->
    <line x1="40" y1="32" x2="52" y2="32" stroke="#1c2321" stroke-width="1"/>
    <line x1="76" y1="32" x2="88" y2="32" stroke="#1c2321" stroke-width="1"/>
    <!-- accent: the diverged link marker, the single place to look first -->
    <circle cx="100" cy="14" r="3" fill="#8a5f08" stroke="none"/>
    <line x1="100" y1="17" x2="100" y2="20" stroke="#8a5f08" stroke-width="1.5"/>
  </g>

  <!-- Wordmark: colour split at the tool | replay morpheme boundary -->
  <g font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
     font-size="30" font-weight="700">
    <text x="16" y="76" fill="#1c2321">tool</text>
    <text x="74" y="76" fill="#276b6b">replay</text>
  </g>
</svg>
