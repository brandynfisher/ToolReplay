<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img"
     aria-labelledby="title desc" width="640" height="340">
  <!--
    Palette reason: this diagram audits a hash chain of tool calls. Slate-teal
    (#276b6b) marks sealed links that replay cleanly. Clay-red (#a5361f) marks
    the two links that carry findings. Amber (#8a5f08) is the single accent and
    marks the one link where replay diverged, index 5. Neutrals are ink
    (#1c2321) for text and paper (#f4f1ea) for the background. No AI-default
    palette. Numbers below are the real SHA-256 digests and findings printed by
    the toolreplay CLI when sealing and replaying samples/session-dirty.jsonl.
  -->
  <title id="title">Replay divergence chain for the dirty sample session</title>
  <desc id="desc">Six hash-chained tool calls, index 0 to 5, each labelled with
    its tool, its truncated SHA-256 digest, and its finding. Index 2 is a
    redundant call, index 4 is permission overreach, and index 5 is where replay
    diverged, marked with the amber accent.</desc>

  <rect x="0" y="0" width="640" height="340" fill="#f4f1ea"/>

  <!-- heading -->
  <text x="24" y="34" fill="#1c2321" font-size="16" font-weight="700"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif">
    samples/session-dirty.jsonl: replay diverged at index 5
  </text>

  <!-- Six links in a vertical chain. Row pitch 44, box 32 tall, x fixed at 24. -->
  <g font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace"
     font-size="12">

    <!-- connectors, one stroke width per role: chain link = 1 -->
    <g stroke="#1c2321" stroke-width="1">
      <line x1="48" y1="88"  x2="48" y2="96"/>
      <line x1="48" y1="132" x2="48" y2="140"/>
      <line x1="48" y1="176" x2="48" y2="184"/>
      <line x1="48" y1="220" x2="48" y2="228"/>
      <line x1="48" y1="264" x2="48" y2="272"/>
    </g>

    <!-- index 0 -->
    <rect x="24" y="56" width="48" height="32" rx="3" fill="#276b6b"/>
    <text x="40" y="76" fill="#f4f1ea" text-anchor="middle" font-weight="700">0</text>
    <text x="88" y="70" fill="#1c2321">list_dir</text>
    <text x="88" y="84" fill="#5a5750">c1bd7fb3</text>

    <!-- index 1 -->
    <rect x="24" y="100" width="48" height="32" rx="3" fill="#276b6b"/>
    <text x="40" y="120" fill="#f4f1ea" text-anchor="middle" font-weight="700">1</text>
    <text x="88" y="114" fill="#1c2321">read_file</text>
    <text x="88" y="128" fill="#5a5750">b5e75534</text>

    <!-- index 2: redundant call -->
    <rect x="24" y="144" width="48" height="32" rx="3" fill="#a5361f"/>
    <text x="40" y="164" fill="#f4f1ea" text-anchor="middle" font-weight="700">2</text>
    <text x="88" y="158" fill="#1c2321">read_file</text>
    <text x="88" y="172" fill="#5a5750">fe5e31cd</text>
    <text x="300" y="166" fill="#a5361f" font-weight="700">redundant call, identical to index 1</text>

    <!-- index 3 -->
    <rect x="24" y="188" width="48" height="32" rx="3" fill="#276b6b"/>
    <text x="40" y="208" fill="#f4f1ea" text-anchor="middle" font-weight="700">3</text>
    <text x="88" y="202" fill="#1c2321">search</text>
    <text x="88" y="216" fill="#5a5750">40aadf3b</text>
    <text x="300" y="210" fill="#5a5750">search install, hits: 3</text>

    <!-- index 4: permission overreach -->
    <rect x="24" y="232" width="48" height="32" rx="3" fill="#a5361f"/>
    <text x="40" y="252" fill="#f4f1ea" text-anchor="middle" font-weight="700">4</text>
    <text x="88" y="246" fill="#1c2321">write_file</text>
    <text x="88" y="260" fill="#5a5750">327da75f</text>
    <text x="300" y="254" fill="#a5361f" font-weight="700">permission overreach, out of scope</text>

    <!-- index 5: divergence, the single accent -->
    <rect x="24" y="276" width="48" height="32" rx="3" fill="#276b6b" stroke="#8a5f08" stroke-width="1.5"/>
    <text x="40" y="296" fill="#f4f1ea" text-anchor="middle" font-weight="700">5</text>
    <text x="88" y="290" fill="#1c2321">search</text>
    <text x="88" y="304" fill="#5a5750">75ccf1fa</text>
    <text x="300" y="298" fill="#1c2321">search install, hits: 7</text>

    <!-- accent marker: the divergence point -->
    <g>
      <circle cx="14" cy="292" r="4" fill="#8a5f08"/>
      <text x="486" y="298" fill="#8a5f08" font-weight="700">diverged: non-determinism</text>
    </g>
  </g>
</svg>
